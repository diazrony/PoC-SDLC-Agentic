apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Un recurso por aplicacion. Desplegar solo una es tan sencillo como
# aplicar su fichero:  kubectl apply -f infrastructure/kubernetes/base/retiros.yaml
resources:
  - authorization.yaml
  - transaction.yaml
  - utils.yaml
  - configuration.yaml
  - health-clinic.yaml
  - retiros.yaml

commonLabels:
  app.kubernetes.io/part-of: quarkus-enterprise-monorepo
