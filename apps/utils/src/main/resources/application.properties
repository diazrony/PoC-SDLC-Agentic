# =============================================================================
# utils : configuracion minima
# Todo valor configurable se resuelve desde variables de entorno con un
# valor por defecto apto para desarrollo local. Aqui NO se versionan secretos.
# =============================================================================

quarkus.application.name=utils
quarkus.http.port=${UTILS_HTTP_PORT:8083}

# ----------------------------- Persistencia ----------------------------------
# H2 en memoria para la PoC. En un entorno real: db-kind=postgresql y la URL,
# el usuario y la password llegan desde el gestor de secretos de la plataforma.
quarkus.datasource.db-kind=h2
quarkus.datasource.username=${DB_USERNAME:sa}
quarkus.datasource.password=${DB_PASSWORD:}
quarkus.datasource.jdbc.url=${DB_JDBC_URL:jdbc:h2:mem:utils;DB_CLOSE_DELAY=-1}
quarkus.hibernate-orm.database.generation=${DB_SCHEMA_GENERATION:drop-and-create}
quarkus.hibernate-orm.sql-load-script=import.sql

# --------------------- Configuracion propia (@ConfigMapping) -----------------
utils.environment=${APP_ENVIRONMENT:local}
utils.max-results=${APP_MAX_RESULTS:50}

# ------------------------------ Observabilidad -------------------------------
# El traceId lo inyecta en el MDC el filtro de lib-observability.
quarkus.log.level=INFO
quarkus.log.console.format=%d{HH:mm:ss.SSS} %-5p [%c{2.}] [traceId=%X{traceId}] %s%e%n

# --------------------------------- Health ------------------------------------
quarkus.smallrye-health.root-path=/q/health
