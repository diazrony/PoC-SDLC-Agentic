# =============================================================================
# Release.
#
# Decision para esta PoC: VERSION UNICA para todo el monorepo (lockstep).
# Es lo mas simple de operar y lo que menos sorpresas da en un equipo que
# empieza con monorepo. Si en el futuro hace falta versionar cada aplicacion
# por separado, la alternativa es Maven CI Friendly Versions (revision/sha1)
# o una herramienta de release independiente por modulo.
#
# Lo que NO cambia con el versionado: cada aplicacion sigue publicando su
# propia imagen y se despliega por separado.
# =============================================================================
name: release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Version a publicar (por ejemplo 1.1.0)'
        required: true
      next_development_version:
        description: 'Siguiente version de desarrollo (por ejemplo 1.2.0-SNAPSHOT)'
        required: true

permissions:
  contents: write
  packages: write

env:
  MAVEN_ARGS: "-B -ntp"

jobs:
  release:
    name: Publicar ${{ inputs.release_version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Configurar Git
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      # versions:set recorre todo el reactor, de modo que las seis aplicaciones
      # y las siete librerias quedan en la misma version de forma coherente.
      - name: Fijar la version de release
        run: ./mvnw $MAVEN_ARGS versions:set -DnewVersion=${{ inputs.release_version }} -DgenerateBackupPoms=false

      - name: Verificar el monorepo completo
        run: ./mvnw $MAVEN_ARGS clean verify

      - name: Etiquetar
        run: |
          git commit -am "release: ${{ inputs.release_version }}"
          git tag -a "v${{ inputs.release_version }}" -m "Release ${{ inputs.release_version }}"

      - name: Publicar imagenes
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          for app in authorization transaction utils configuration health-clinic retiros; do
            docker build \
              -f "apps/$app/src/main/docker/Dockerfile.jvm" \
              -t "ghcr.io/${{ github.repository }}/$app:${{ inputs.release_version }}" \
              "apps/$app"
            docker push "ghcr.io/${{ github.repository }}/$app:${{ inputs.release_version }}"
          done

      - name: Abrir el siguiente ciclo de desarrollo
        run: |
          ./mvnw $MAVEN_ARGS versions:set -DnewVersion=${{ inputs.next_development_version }} -DgenerateBackupPoms=false
          git commit -am "chore: iniciar ${{ inputs.next_development_version }}"
          git push origin HEAD --tags
