# =============================================================================
# Pipeline de Pull Request: SOLO proyectos afectados.
#
#   Pull Request -> Detect Changes -> Affected Projects -> Compile
#     -> Unit Tests -> Architecture Tests -> JaCoCo -> Static Analysis
#     -> Security -> Package
#
# La clave de un monorepo sano es que el tiempo de CI dependa del TAMANIO DEL
# CAMBIO y no del tamanio del repositorio.
# =============================================================================
name: pull-request

on:
  pull_request:
    branches: [ main ]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  MAVEN_ARGS: "-B -ntp"

jobs:
  # ---------------------------------------------------------------------------
  # 1. Detect Changes + Affected Projects
  # ---------------------------------------------------------------------------
  affected:
    name: Detect affected projects
    runs-on: ubuntu-latest
    outputs:
      affected: ${{ steps.detect.outputs.affected }}
      modules: ${{ steps.detect.outputs.modules }}
      maven_args: ${{ steps.detect.outputs.maven_args }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Historia completa: sin ella no hay merge-base y el diff es inutil.
          fetch-depth: 0

      - id: detect
        name: Calcular proyectos afectados
        run: scripts/affected-projects.sh --base "origin/${{ github.base_ref }}" --format github

      - name: Resumen
        run: |
          echo "### Proyectos afectados" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          scripts/affected-projects.sh --base "origin/${{ github.base_ref }}" --format list >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 2. Compile + Unit Tests + Architecture Tests + JaCoCo
  # ---------------------------------------------------------------------------
  verify:
    name: Compile, test y arquitectura
    needs: affected
    if: needs.affected.outputs.affected == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Enforcer (Java 21, Maven, fronteras apps/libs)
        run: ./mvnw $MAVEN_ARGS ${{ needs.affected.outputs.maven_args }} validate

      - name: Compile
        run: ./mvnw $MAVEN_ARGS ${{ needs.affected.outputs.maven_args }} compile

      # Los tests de arquitectura se ejecutan aparte para que su fallo sea
      # inmediatamente reconocible en la lista de checks del Pull Request.
      - name: Architecture tests (ArchUnit)
        run: ./mvnw $MAVEN_ARGS ${{ needs.affected.outputs.maven_args }} test -Dtest=ArchitectureTest -DfailIfNoTests=false

      - name: Unit + integration tests y JaCoCo
        run: ./mvnw $MAVEN_ARGS ${{ needs.affected.outputs.maven_args }} verify

      - name: Publicar informe de cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-reports
          path: '**/target/site/jacoco/**'
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 3. Static Analysis
  # ---------------------------------------------------------------------------
  static-analysis:
    name: Analisis estatico
    needs: affected
    if: needs.affected.outputs.affected == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Sustituir por SonarQube / SonarCloud cuando exista el servidor:
      #   ./mvnw sonar:sonar -Dsonar.projectKey=... -Dsonar.host.url=...
      - name: Dependencias desactualizadas (informativo)
        run: ./mvnw $MAVEN_ARGS versions:display-dependency-updates -DprocessDependencyManagementTransitive=false || true

      - name: Convergencia de dependencias
        run: ./mvnw $MAVEN_ARGS -Pdependency-convergence ${{ needs.affected.outputs.maven_args }} validate

  # ---------------------------------------------------------------------------
  # 4. Package: una imagen por aplicacion afectada
  # ---------------------------------------------------------------------------
  package:
    name: Package
    needs: [ affected, verify, static-analysis ]
    if: needs.affected.outputs.affected == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Empaquetar aplicaciones afectadas
        run: ./mvnw $MAVEN_ARGS ${{ needs.affected.outputs.maven_args }} package -DskipTests

      - name: Subir artefactos
        uses: actions/upload-artifact@v4
        with:
          name: quarkus-apps
          path: 'apps/*/target/quarkus-app/**'
          if-no-files-found: ignore
